- Evidence:
  - Benchmark: docs/benchmark.md
  - What the recall research established: docs/research-results.md
  - "Case study: duplicate debt exposed four bugs": docs/case-studies/pytest-selective.md
  - "Case study: what a zero-duplication backlog improved": docs/case-studies/pytest-obligation-cleanup.md
