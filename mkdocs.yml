  - Why dry-lint: docs/why.md
  - "Tutorial: first run to required check": docs/tutorials/first-run.md
  - How CI runs dry-lint: docs/ci.md
  - Adopt it in a repository: docs/adoption-playbook.md
  - GitHub Action reference: docs/github-action.md
  - TypeScript and Bun: docs/typescript.md
  - What the pull request comment shows: docs/comment-preview.md
- Configure and run:
  - Judges and presets: docs/judges.md
  - Retrieval presets: docs/retrieval-presets.md
  - Sweep a repository and ratchet its debt: docs/sweeps.md
  - Detect duplicated model ownership: docs/model-duplication.md
  - Default model review: docs/model-adoption.md
  - Find a helper's work inside a larger function: docs/operation-blocks.md
  - Offline CPU recovery: docs/cpu-recovery.md
  - Dryer structural comparer: docs/detectors.md
  - Plugins: docs/plugins.md
- Across repositories:
  - Find duplication across repositories: docs/workspaces.md
  - Share function indexes: docs/function-indexes.md
- How it works:
