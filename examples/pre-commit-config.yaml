# .pre-commit-config.yaml: check staged functions before each commit, for the coding agent making it.
# Needs TYPESAFE_AI_API_KEY in your shell or in an untracked .env.
default_install_hook_types: [pre-commit, prepare-commit-msg]
default_stages: [pre-commit]
minimum_pre_commit_version: '4.3.0'
repos:
  - repo: https://github.com/gigaverse-app/dry-lint
    # Check weekly while dry-lint stabilizes, and after important fixes:
    # uvx pre-commit autoupdate --repo https://github.com/gigaverse-app/dry-lint
    # Review and commit the new tag; rev does not support ranges or automatic refresh.
    rev: v1.4.2
    hooks:
      - id: dry-lint
        # args: [--preset, agent+haiku]   # Haiku re-judges Jev's uncertain scores; needs ANTHROPIC_API_KEY too
        # args: [--preset, auto]          # precision first, as in CI, for people committing by hand
        # verbose: true                   # show the hook's tally of what it kept out on every commit
      # What the hook kept out goes into the commit's trailers, so the pull request's comment counts it.
      - id: dry-lint-trailers
