# .pre-commit-config.yaml: check staged functions before each commit, for the coding agent making it.
# Needs ANTHROPIC_API_KEY in your shell or in an untracked .env.
#
# `rev: v1` follows dry-lint's 1.x releases, but pre-commit caches the first install and warns that v1 is a mutable
# reference. To pick up a newer 1.x release: `pre-commit clean && pre-commit install --install-hooks`.
default_install_hook_types: [pre-commit, prepare-commit-msg]
default_stages: [pre-commit]  # so other hooks do not also run at prepare-commit-msg
minimum_pre_commit_version: '4.3.0'
repos:
  - repo: https://github.com/gigaverse-app/dry-lint
    rev: v1
    hooks:
      - id: dry-lint
        # Inherit preset=balanced from repository settings, as CI and the baseline do.
        args: [--baseline, .dry-lint/baseline.json, --require-complete]
        # Without a baseline, omit --baseline. Model ownership findings require agent review.
      # Records absence/dismissal without claiming verified removal.
      - id: dry-lint-trailers
