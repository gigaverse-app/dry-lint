def module_name(self, path: str) -> str | None:
        """Invert `module_path`: `pkg/__init__.py` is `pkg`, so `from pkg import Name` maps too."""
        source = PurePosixPath(path)
        if source.suffix != ".py":
            return None
        parts = [*self.package(path), source.stem]
        if parts[-1] == "__init__":
            parts.pop()
        return ".".join(parts) or None
'''

