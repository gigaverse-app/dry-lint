code = '''
    async def read(self, channel_id: str, now: datetime) -> SportsMemory | None:
        # Optional context cannot stall or disable the initial shared decision bundle.
        try:
            async with asyncio.timeout(0.25):
                raw = await self.throttle.raw_client.get(self.key(channel_id))
        except RedisError, TimeoutError:
            return None
        memory = SportsMemory.model_validate_json(raw).live(now) if raw else None
        return memory if memory and (memory.items or memory.roster) else None
'''

