code = '''
function getTypingLabel(names: string[]) {
  if (names.length === 1) {
    return `${names[0]} is typing`;
  }

  if (names.length === 2) {
    return `${names[0]} and ${names[1]} are typing`;
  }

  return `${names[0]} and ${names.length - 1} others are typing`;
}
'''

