# .github/workflows/dry-lint-bootstrap.yml: accept the existing backlog in Actions, for when no judge key is at hand.
#
# Commit this file with .dry-lint/config.toml on the adoption branch and push. Every push that changes either file runs it
# on that branch (a push needs no default-branch registration, unlike workflow_dispatch), so editing a pattern and
# pushing runs it again. It judges every candidate pair once and uploads .dry-lint/, the README and the sweep report
# as the `dry-lint-baseline` artifact:
#
#   gh run list --repo OWNER/NAME --branch "$(git branch --show-current)" --json databaseId,name,status,headSha \
#     --jq '.[] | select(.name == "dry-lint bootstrap")'
#   OUT=$(mktemp -d) && gh run download RUN_ID --repo OWNER/NAME --name dry-lint-baseline --dir "$OUT"
#
# Copy .dry-lint/ and README.md (when there is one) from $OUT into the repository, and delete this workflow in the same commit. Nothing
# here writes to the repository: the files arrive only through the commit you review.
name: dry-lint bootstrap
on:
  push:
    paths: [.github/workflows/dry-lint-bootstrap.yml, .dry-lint/config.toml, .dry-lint/ignore.yaml, .dry-lint.toml, pyproject.toml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'  # the parser: use the newest Python syntax your code needs
      - name: Install dry-lint
        # The same major version as gigaverse-app/dry-lint@v1 and the hook's rev: v1.
        run: python -m pip install 'dry-lint[anthropic]>=1,<2'  # 'dry-lint[anthropic]>=1,<2' for a Claude preset
      - name: Accept the existing backlog
        env:
          # Your secret can have any name; balanced reads ANTHROPIC_API_KEY.
          TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # balanced function judging
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OUT: ${{ runner.temp }}/dry-lint-baseline
        # --budget-usd: 1 is ample for Jev (273 pairs cost $0.010); use 5 for a Claude preset.
        # --repository-id: the README's counter sign is keyed by a hash of this numeric id, never by the name.
        # The progress block goes only into a Markdown README.md; without one, this step writes and ships no README.
        run: |
          mkdir -p "$OUT"
          dry-lint config
          readme=()
          if [[ -f README.md ]]; then readme=(--readme README.md); fi
          dry-lint sweep --init --budget-usd 1 "${readme[@]}" --report "$OUT/sweep-report.json" \
            --repository "$GITHUB_REPOSITORY" --repository-id "$GITHUB_REPOSITORY_ID" --branch "$DEFAULT_BRANCH"
          mkdir -p "$OUT/.dry-lint"
          for file in baseline.json progress.json models.json; do
            if [[ -f ".dry-lint/$file" ]]; then cp ".dry-lint/$file" "$OUT/.dry-lint/"; fi
          done
          if [[ -f README.md ]]; then cp README.md "$OUT/"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dry-lint-baseline
          path: ${{ runner.temp }}/dry-lint-baseline
          include-hidden-files: true  # .dry-lint/ starts with a dot
          if-no-files-found: error
          retention-days: 7
