name: dry-lint audit
# Weekly, or dispatched after merging a cleanup: dry-lint's own audit workflow sweeps the repository against the
# accepted backlog and opens or updates one dry-lint/ratchet pull request recording what was cleaned. Its steps ship
# with dry-lint releases; this file only says when it runs and with which credentials.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    uses: gigaverse-app/dry-lint/.github/workflows/audit.yml@v1
    # with:
    #   python-version: '3.14'      # the newest syntax your code uses (default 3.13)
    #   budget-usd: '1'             # ample for a Jev preset (default 5, for a Claude preset such as balanced)
    #   plugins: my-judge-plugin    # extra judge packages; the Anthropic SDK for Claude presets is already installed
    secrets:
      # The same judge as dry-lint.yml: your TypeSafe key's secret, under whatever name you gave it.
      TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # balanced function judging
      DRY_LINT_RATCHET_TOKEN: ${{ secrets.DRY_LINT_RATCHET_TOKEN }}
