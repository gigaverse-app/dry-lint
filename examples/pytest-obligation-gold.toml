code = '''
def referenced_columns(expression: str, candidates: Collection[str]) -> set[str]:
    """Which of ``candidates`` an expression PostgreSQL printed names, outside its string literals."""
    text = blank_literals_and_comments(expression)
    names = {quoted or bare for quoted, bare in _IDENTIFIER.findall(text)}
    return names & set(candidates)
'''

[pair.existing]
id = "package/src/pytest_obligation/integrations/_internal/postgres_sql.py::bare_identifiers"
source = "https://github.com/gigaverse-app/pytest-obligation/blob/d39f77ea343a25bf0a065376ea7a50ed38c7b2f6/package/src/pytest_obligation/integrations/_internal/postgres_sql.py#L108-L126"
sha256 = "a4c4f69b9e99892fe5190b7159f7a9acd8d2e4fce911dffa9a03de5e397bdb0e"
code = '''
def bare_identifiers(sql: str) -> str:
    """
    SQL text with literals and comments blanked, and each quoted identifier reduced to its bare name.

    For a reader that matches column names with a word pattern: a column named
    only inside a string literal (``'available_at <= soon'``) is no column, and a
    quoted identifier that is a plain word (``"order"``) is the same column bare.
    One that is not a plain word (``"odd name"``) is blanked, since no word
    pattern can name it faithfully.
    """

    def bare(match: re.Match[str]) -> str:
        quoted, word = match.group(1), match.group(2)
        if word is not None:
            return word
        quoted = quoted.replace('""', '"')
        return quoted if quoted.isidentifier() else " " * len(match.group(0))

    return _NAME.sub(bare, blank_literals_and_comments(sql))
'''

