# .github/workflows/dry-lint-judge.yml: judge and comment on pull requests from forks.
#
# A fork's pull request runs dry-lint.yml without secrets, so it only uploads candidates. This workflow runs
# after it from the default branch, with secrets. It never checks out or runs the fork's code: it judges the
# uploaded candidates and comments only if they belong to the pull request's current head commit.
name: dry-lint judge
on:
  # workflow_run is the design, not an oversight: it is how a fork's pull request is judged with secrets without
  # running the fork's code. This job reads only the uploaded candidates, checks out the default branch, and comments
  # only for the pull request's current head, so zizmor's warning about the trigger does not apply.
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: [dry-lint]
    types: [completed]

permissions:
  actions: read          # download the triggering run's candidates artifact
  checks: write          # post the judged `dry-lint` check on the pull request's head
  contents: read         # check out the default branch's settings
  pull-requests: write   # keep the sticky comment

jobs:
  judge:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The default branch, for its settings; never the fork's code.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: gigaverse-app/dry-lint@v1
        with:
          # The same judge inputs as dry-lint.yml: your TypeSafe key's secret, under whatever name you gave it.
          typesafe-api-key: ${{ secrets.TYPESAFE_AI_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}   # balanced function judging
          # baseline: .dry-lint/baseline.json
          # require-complete: 'true'
