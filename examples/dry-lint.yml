# .github/workflows/dry-lint.yml: annotate and comment on pull requests that re-implement existing code.
#
# Pull requests from this repository are judged and commented on here. Pull requests from forks get no secrets,
# so this job only proposes candidates; add dry-lint-judge.yml to judge them.
name: dry-lint
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]  # labels: the override label re-runs it
  push:
    branches: [main]  # judges merged code too, and its verdict cache is shared with every pull request

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dry-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dry-lint:
    # Only the override label is worth a re-run when labels change.
    if: "github.event.action != 'labeled' && github.event.action != 'unlabeled' || github.event.label.name == 'dry-lint: override'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: gigaverse-app/dry-lint@main
        with:
          typesafe-api-key: ${{ secrets.TYPESAFE_AI_API_KEY }}
          # anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}   # Claude Sonnet's second opinion on borderline scores
          # Every reported duplicate fails the check; the `dry-lint: override` label lets one through.
          # fail-at: "0.91"     # fail only on near-certain duplicates; the rest warn
          # warn-only: "true"   # never fail
