# .github/workflows/dry-lint.yml: annotate and comment on pull requests that re-implement existing code.
name: dry-lint
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dry-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # the merge base with the pull request base is needed
      - uses: gigaverse-app/dry-lint@main
        with:
          typesafe-api-key: ${{ secrets.TYPESAFE_AI_API_KEY }}
          # fail-on-findings: "true"   # once the team trusts it
