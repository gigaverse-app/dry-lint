minimum_pre_commit_version: '4.3.0'
# For working on dry-lint itself: `uvx pre-commit install`. The hooks dry-lint ships to adopters are in
# .pre-commit-hooks.yaml.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint (uv.lock)
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format (uv.lock)
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
