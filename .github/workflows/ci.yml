name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Plans whole lanes before any runner starts: each lane is the name a job's condition reads, and a change selects it
  # through the tests, scripts and actions that job runs, so a documentation-only pull request runs only the lint
  # jobs and the gate. `ci-esta lanes` shows the lanes and why; .github/test-lanes.json adds the one rule the graphs
  # cannot see.
  select-tests:
    name: Select tests
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.lanes.outputs.lanes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        uses: gigaverse-app/ci-esta/actions/plan-work@v1
        with:
          config: .github/test-lanes.json
      # dry-lint on itself has no pull request to judge in a manual run, and every push to main folds the ledger.
      - id: lanes
        env:
          PLANNED: ${{ steps.plan.outputs.lanes }}
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT" in
            workflow_dispatch) dogfood=false ;;
            push) dogfood=true ;;
            *) dogfood=$(jq '.dogfood' <<<"$PLANNED") ;;
          esac
          echo "lanes=$(jq -c --argjson dogfood "$dogfood" '.dogfood = $dogfood' <<<"$PLANNED")" >> "$GITHUB_OUTPUT"

  test:
    name: Test (Python ${{ matrix.python }})
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).tests) }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      # CI-esta's uv setup; it always runs `uv sync --locked`. Restoring the whole environment measured slower
      # than installing this small one (5-6 s against 4-5 s), so only uv's package cache is kept.
      - uses: gigaverse-app/ci-esta/actions/setup-cached-uv@v1
        with:
          python-version: ${{ matrix.python }}
          cache-environment: "false"
          sync-args: --extra cpu-embedding
      # The CPU recovery tests need the pinned MiniLM artifacts; without them they skip and coverage falls to 98%.
      # The revision and SHA256s are the ones `dry_lint.cpu_embedding.ARTIFACTS` verifies at runtime.
      - name: Restore pinned MiniLM
        id: minilm
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/minilm
          key: minilm-1110a243fdf4706b3f48f1d95db1a4f5529b4d41
      - name: Fetch pinned MiniLM
        if: steps.minilm.outputs.cache-hit != 'true'
        env:
          MINILM: ${{ runner.temp }}/minilm
          SOURCE: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/1110a243fdf4706b3f48f1d95db1a4f5529b4d41
        run: |
          mkdir -p "$MINILM/onnx"
          curl --fail --location --silent --show-error "$SOURCE/onnx/model.onnx" -o "$MINILM/onnx/model.onnx"
          curl --fail --location --silent --show-error "$SOURCE/tokenizer.json" -o "$MINILM/tokenizer.json"
          cd "$MINILM" && sha256sum --check <<'SUMS'
          6fd5d72fe4589f189f8ebc006442dbb529bb7ce38f8082112682524616046452  onnx/model.onnx
          be50c3628f2bf5bb5e3a7f17b1f74611b2561a3a27eeab05e5aa30f411572037  tokenizer.json
          SUMS
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest -q --cov --cov-report=term-missing --cov-fail-under=100
        env:
          DRY_LINT_TEST_MINILM_DIR: ${{ runner.temp }}/minilm
      - run: uv build
      - name: Default install stays lightweight
        run: >-
          uv run --isolated --no-project --with . python -c
          "from importlib.util import find_spec; from dry_lint.plugins import load;
          from dry_lint.settings import Settings; load('comparers', Settings().comparer).index([]); assert find_spec('dryer') is None"

  counter:
    name: Test the global counter
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).counter) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: counter
    steps:
      - uses: actions/checkout@v7
      # The counter's rules have no dependencies; Node's own test runner checks them.
      - run: node --test

  viewer:
    name: Test the comparison viewer
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).viewer) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test viewer/diff.test.mjs

  contracts:
    name: Model-based contracts
    needs: select-tests
    permissions:
      contents: read
      # The contract report's pull-request comment.
      pull-requests: write
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).contracts) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # pytest-quint-connect installs its pinned Quint with npm on first use.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: uv sync --group quint
      # The typed driver base must match the model it was generated from.
      - run: uv run --no-sync pytest-quint-connect codegen --check contracts/campaign/quint-connect.json
      # Replays Quint-generated histories of the campaign ledger against the real CampaignStore.
      - run: >-
          uv run --no-sync pytest -c contracts/quint.ini contracts --quint-require-complete
          --junitxml=contracts/.artifacts/quint-connect/junit.xml
      # One updated PR comment, an artifact of every receipt and mismatch, and a check that the README's
      # contract block still matches the run. v1 moves with the uv.lock pin's major version.
      - uses: gigaverse-app/pytest-quint-connect/report@v1
        if: ${{ !cancelled() }}

  lint-ci:
    name: Lint the action and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # dry-lint ships a composite action: actionlint, action-validator and ShellCheck check it and the workflows.
      - uses: gigaverse-app/ci-esta/actions/lint-ci-code@v1
        with:
          action-files: action.yml
          workflow-files: |
            .github/workflows/ci.yml
            .github/workflows/observe-ci.yml
            .github/workflows/release.yml
            .github/workflows/docs.yml
            .github/workflows/dryer.yml
            .github/workflows/counter.yml
            .github/workflows/viewer.yml
            .github/workflows/audit.yml
            examples/dry-lint.yml
            examples/dry-lint-judge.yml
            examples/dry-lint-audit.yml
            examples/dry-lint-bootstrap.yml
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: shellcheck scripts/install-action.sh
      # Each lane-gated job's condition, the gate's lane-jobs and the lanes the workflow defines must agree.
      - uses: astral-sh/setup-uv@v7
      # Adopters who run zizmor must get no findings from the workflows they copy, except their own pinning policy.
      - name: Audit the example workflows with zizmor
        run: >-
          uvx --from 'zizmor>=1.32,<2' zizmor --offline --config .github/zizmor.yml
          examples/dry-lint.yml examples/dry-lint-judge.yml examples/dry-lint-audit.yml examples/dry-lint-bootstrap.yml
      - name: Check the lane wiring
        run: >-
          uvx --python 3.13 --from "ci-esta[selection]>=1.11.0,<2.0.0"
          ci-esta check-workflow --workflow .github/workflows/ci.yml --lanes .github/test-lanes.json

  dogfood:
    name: dry-lint on itself
    # On main too: that run judges merged code and folds merged pull requests into the repository's ledger.
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).dogfood) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: ./
        id: dry-lint
        with:
          # Temporary credential exception: this repo has no Anthropic secret.
          # Keep explicit Jev enforcement until a Claude key is provisioned; local regressions use balanced.
          preset: jev
          typesafe-api-key: ${{ secrets.TYPESAFE_AI_API_KEY }}
          # Merged code was reviewed already, overrides included: on main, report but never fail.
          warn-only: ${{ github.event_name == 'push' }}
          # dry-lint contributes its own settled pairs to its benchmark (registered in docs/goldens/adopters.toml).
          share-goldens: 'true'
      - name: The action reports its mode and result
        env:
          MODE: ${{ steps.dry-lint.outputs.mode }}
          CODE: ${{ steps.dry-lint.outputs.exit-code }}
        run: |
          echo "mode=$MODE exit-code=$CODE"
          [ "$MODE" = single ] && [ "$CODE" != 2 ]

  consumer-install:
    name: Install in consumer repos (${{ matrix.os }})
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).package) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install and run with Python and Node consumer settings
        shell: bash
        run: uv run --no-config --no-project --python 3.13 python scripts/test_action_install.py

  gate:
    name: Validation gate
    if: ${{ !cancelled() }}
    needs: [select-tests, test, counter, viewer, contracts, lint-ci, dogfood, consumer-install]
    runs-on: ubuntu-latest
    steps:
      # The one check to require. A lane job may be skipped only when the planner succeeded and returned false for
      # its lane; any other missing, failed, cancelled or skipped prerequisite fails the gate. The optional Dryer
      # job stays outside it.
      - uses: gigaverse-app/ci-esta/actions/validation-gate@v1
        with:
          needs: ${{ toJSON(needs) }}
          lanes: ${{ needs.select-tests.outputs.lanes || '{}' }}
          lane-jobs: '{"test":["tests"],"counter":["counter"],"viewer":["viewer"],"contracts":["contracts"],"dogfood":["dogfood"],"consumer-install":["package"]}'
