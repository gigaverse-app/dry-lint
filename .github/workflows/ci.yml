name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dryer
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest -q --cov --cov-report=term-missing --cov-fail-under=100
      - run: uv build
      - name: Default install stays lightweight
        run: >-
          uv run --isolated --no-project --with . python -c
          "from importlib.util import find_spec; from dry_lint.sources import make_source;
          from dry_lint.settings import Settings; make_source([], Settings()); assert find_spec('dryer') is None"

  dogfood:
    name: dry-lint on itself
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./
        with:
          typesafe-api-key: ${{ secrets.TYPESAFE_AI_API_KEY }}
