name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # CI-esta's uv setup; it always runs `uv sync --locked`. Restoring the whole environment measured slower
      # than installing this small one (5-6 s against 4-5 s), so only uv's package cache is kept.
      - uses: gigaverse-app/ci-esta/actions/setup-cached-uv@a3ded1d6b3cf7f555e7cc53050518a93d469e9f2 # v1
        with:
          python-version: ${{ matrix.python }}
          cache-environment: "false"
          sync-args: --extra dryer
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest -q --cov --cov-report=term-missing --cov-fail-under=100
      - run: uv build
      - name: Default install stays lightweight
        run: >-
          uv run --isolated --no-project --with . python -c
          "from importlib.util import find_spec; from dry_lint.plugins import load;
          from dry_lint.settings import Settings; load('comparers', Settings().comparer).index([]); assert find_spec('dryer') is None"

  counter:
    name: Test the global counter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: counter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The counter's rules have no dependencies; Node's own test runner checks them.
      - run: node --test

  lint-ci:
    name: Lint the action and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # dry-lint ships a composite action: actionlint, action-validator and ShellCheck check it and the workflows.
      - uses: gigaverse-app/ci-esta/actions/lint-ci-code@a3ded1d6b3cf7f555e7cc53050518a93d469e9f2 # v1
        with:
          action-files: action.yml
          workflow-files: |
            .github/workflows/ci.yml
            .github/workflows/observe-ci.yml
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  dogfood:
    name: dry-lint on itself
    # On main too: that run judges merged code and folds merged pull requests into the repository's ledger.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: ./
        id: dry-lint
        with:
          typesafe-api-key: ${{ secrets.TYPESAFE_AI_API_KEY }}
          # Merged code was reviewed already, overrides included: on main, report but never fail.
          warn-only: ${{ github.event_name == 'push' }}
      - name: The action reports its mode and result
        env:
          MODE: ${{ steps.dry-lint.outputs.mode }}
          CODE: ${{ steps.dry-lint.outputs.exit-code }}
        run: |
          echo "mode=$MODE exit-code=$CODE"
          [ "$MODE" = single ] && [ "$CODE" != 2 ]

  consumer-install:
    name: Install inside a consumer with its own uv settings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: dry-lint
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # A consumer's own uv settings must not reach the action's locked install: this cap conflicts with the lock.
      - name: A consumer whose uv settings conflict with dry-lint's lock
        run: |
          mkdir consumer
          printf '%s\n' '[project]' 'name = "consumer"' 'version = "0"' '' '[tool.uv]' \
            'constraint-dependencies = ["pydantic<2.14"]' > consumer/pyproject.toml
      - name: The action's install step succeeds there
        working-directory: consumer
        env:
          GITHUB_ACTION_PATH: ${{ github.workspace }}/dry-lint
          PLUGINS: ""
        run: |
          yq '.runs.steps[] | select(.name == "Install dry-lint") | .run' "$GITHUB_ACTION_PATH/action.yml" \
            > "$RUNNER_TEMP/install.sh"
          bash -e -o pipefail "$RUNNER_TEMP/install.sh"
          "$RUNNER_TEMP/dry-lint-venv/bin/python" -c "import dry_lint, pydantic; print('pydantic', pydantic.VERSION)"

  gate:
    name: CI gate
    if: always()
    needs: [test, counter, lint-ci, dogfood, consumer-install]
    runs-on: ubuntu-latest
    steps:
      # The one check to require: fails on any missing, failed, cancelled or unexpectedly skipped prerequisite.
      - uses: gigaverse-app/ci-esta/actions/validation-gate@a3ded1d6b3cf7f555e7cc53050518a93d469e9f2 # v1
        with:
          needs: ${{ toJSON(needs) }}
          required: >-
            {"test": true, "counter": true, "lint-ci": true, "consumer-install": true, "dogfood": ${{ github.event_name != 'workflow_dispatch' }}}
