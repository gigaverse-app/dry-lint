# CI-esta's report for each completed CI run: gate latency, critical path, step timings and runner usage, as a
# sticky comment on the pull request. It runs from the default branch and reads the run as data, with no checkout.
name: CI report
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: gigaverse-app/ci-esta/actions/ci-observability@a3ded1d6b3cf7f555e7cc53050518a93d469e9f2 # v1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          run-attempt: ${{ github.event.workflow_run.run_attempt }}
          commit-sha: ${{ github.event.workflow_run.head_sha }}
          pull-request-number: ${{ format('{0}', github.event.workflow_run.pull_requests[0].number || '') }}
          required-gates-json: '[{"kind":"actions_job","job_name":"CI gate"}]'
          analyze-critical-path: "true"
          post-sticky: "true"
          sticky-workflow: CI
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-report-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: |
            ci-observability.json
            ci-observability.md
            ci-observability.prom
          if-no-files-found: error
