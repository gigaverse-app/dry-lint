name: dry-lint audit
# The audit every adopter runs, shipped with dry-lint so a fix reaches every repository with a release instead of a
# copy edited in each. An adopter's workflow says when (a schedule, a dispatch) and with which credentials; see
# examples/dry-lint-audit.yml. It audits the whole repository against the accepted backlog, then ratchets it: pairs
# that were refactored away or judged separate are recorded as cleaned in .dry-lint/baseline.json, progress.json and
# the README block, through one standing pull request that runs the ordinary checks. The baseline only ever shrinks;
# a new blocking pair fails the audit and no ratchet pull request is opened.
on:
  workflow_call:
    inputs:
      python-version:
        description: Python that parses the repository's source; match its newest syntax.
        type: string
        default: '3.13'
      budget-usd:
        description: Most the whole-repository audit may spend on judging; 1 is ample for Jev, use 5 for a Claude preset.
        type: string
        default: '1'
      plugins:
        description: Extra judge packages, for example anthropic==2.4.0 for a Claude preset.
        type: string
        default: ''
    secrets:
      TYPESAFE_AI_API_KEY:
        description: Jev's key, for the default presets.
        required: false
      ANTHROPIC_API_KEY:
        description: For the presets that judge with Claude (jev+opus, sonnet).
        required: false
      DRY_LINT_RATCHET_TOKEN:
        description: >-
          Fine-grained or GitHub App token with contents and pull-requests write, so the ratchet pull request runs
          the repository's checks. Without it the audit still runs and the ratchet step fails visibly.
        required: false
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    concurrency:
      group: dry-lint-audit-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gigaverse-app/dry-lint@v1
        with:
          mode: sweep
          base: HEAD
          python-version: ${{ inputs.python-version }}
          typesafe-api-key: ${{ secrets.TYPESAFE_AI_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugins: ${{ inputs.plugins }}
          baseline: .dry-lint/baseline.json
          require-complete: 'true'
          budget-usd: ${{ inputs.budget-usd }}
      # The function sweep does not audit models. Preserve the complete candidate inventory for source review;
      # an atomic score must never accept or dismiss a model pair on the adopter's behalf.
      - name: Retire resolved reviewed model debt
        if: ${{ !cancelled() }}
        run: |
          if [[ -f .dry-lint/models.json ]]; then
            dry-lint model-baseline --update
          fi
      - name: Export model candidates for ownership review
        if: ${{ !cancelled() }}
        run: |
          dry-lint detect --all --out "$RUNNER_TEMP/dry-lint/candidates.json"
          dry-lint judge --candidates "$RUNNER_TEMP/dry-lint/candidates.json" --judge none \
            --report "$RUNNER_TEMP/dry-lint/model-review.json" --output "$RUNNER_TEMP/dry-lint/model-review.md"
      - name: Retain the audit for human or agent review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dry-lint-audit
          path: |
            ${{ runner.temp }}/dry-lint/report.json
            ${{ runner.temp }}/dry-lint/comment.md
            ${{ runner.temp }}/dry-lint/candidates.json
            ${{ runner.temp }}/dry-lint/model-review.json
            ${{ runner.temp }}/dry-lint/model-review.md
          retention-days: 30
          if-no-files-found: warn
      - name: Require ratchet PR authentication
        env:
          HAS_RATCHET_TOKEN: ${{ secrets.DRY_LINT_RATCHET_TOKEN != '' }}
        run: |
          if [[ "$HAS_RATCHET_TOKEN" != "true" ]]; then
            echo "::error::Add a DRY_LINT_RATCHET_TOKEN secret (fine-grained or GitHub App token, contents and pull-requests write) so the ratchet pull request runs CI. The audit above already ran."
            exit 1
          fi
      # The Action's sweep mode only audits. The CLI records the ratchet, reusing the verdicts the audit just stored,
      # and the exact CLI environment installed by the Action. No second install or judge-version drift.
      - name: Record cleaned pairs
        env:
          TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUDGET_USD: ${{ inputs.budget-usd }}
          # A scheduled run's event names no repository, but it runs on the default branch, so its ref is that branch.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        # The progress block lives only in a Markdown README.md; without one, the sweep records just the files.
        run: |
          readme=()
          if [[ -f README.md ]]; then readme=(--readme README.md); fi
          dry-lint sweep --update --store "$RUNNER_TEMP/dry-lint/verdicts" --budget-usd "$BUDGET_USD" \
            "${readme[@]}" --repository "$GITHUB_REPOSITORY" --branch "$DEFAULT_BRANCH"
      # `git add` stages nothing at all when one listed path is missing, so the ratchet pull request would never
      # open. List only the files that exist: models.json and README.md are optional.
      - name: List the files the ratchet commits
        id: ratchet
        run: |
          {
            echo 'paths<<EOF'
            for path in .dry-lint/baseline.json .dry-lint/progress.json .dry-lint/models.json README.md; do
              if [[ -f "$path" ]]; then echo "$path"; fi
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"
      # One standing branch: a later run updates the open ratchet PR instead of stacking another. The adopter-owned
      # credential makes the PR run ordinary CI, including the required dry-lint check that refuses any widening.
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DRY_LINT_RATCHET_TOKEN }}
          branch: dry-lint/ratchet
          delete-branch: true
          add-paths: ${{ steps.ratchet.outputs.paths }}
          commit-message: 'chore(dry-lint): record cleaned duplicate pairs in the baseline'
          title: 'chore(dry-lint): record cleaned duplicate pairs in the baseline'
          body: |
            ## TLDR

            The weekly dry-lint audit found accepted duplicate pairs that no longer exist or were judged separate,
            and shrinks `.dry-lint/baseline.json`, the progress badge and the README block to match.

            The baseline can only shrink: the required `dry-lint` check rejects any pull request that widens it.
            The full audit is in the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            ```text
            BEFORE: merged cleanup -> accepted baseline and README still show old debt
            AFTER:  complete audit -> reviewed metadata PR -> baseline and README record cleanup
            ```

            | Policy | Before | After |
            | --- | --- | --- |
            | Accepted pairs | Previously recorded states | Removed/separate pairs marked cleaned; explicit exclusions dismissed |
            | New debt | Rejected | Still rejected; no added allowances |

            Pair-count changes appear in the baseline/progress diff and the linked audit. No application code changes.
            Model candidates remain source-review work; scores never accept or dismiss model debt.
            Function progress totals and model debt are separate inventories.
