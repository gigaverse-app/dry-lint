name: dry-lint
description: Find functions a pull request re-implements, judge them, and annotate and comment on the pull request.
author: Gigaverse
branding:
  icon: copy
  color: purple

inputs:
  mode:
    description: >
      auto (default): judge on workflow_run, detect on a pull request from a fork, single otherwise.
      single: detect, judge and comment in one job. detect: propose candidates and upload them, for fork PRs
      (no secrets). judge: in a workflow_run workflow, judge the candidates the triggering run uploaded.
      index: publish committed functions as an artifact. fetch-indexes: download peer indexes for a later CLI scan.
    required: false
    default: auto
  typesafe-api-key:
    description: TypeSafe API key. With it the Jev judge runs; without it (and no judge-command) dry-lint only lists look-alikes in the log.
    required: false
    default: ""
  anthropic-api-key:
    description: >
      Anthropic API key. With typesafe-api-key, preset jev+opus: Claude Opus re-judges the Jev scores it is least
      sure of, for 98% precision and 85% recall within the budget, about $0.005 a pull request. Empty means no
      escalation. (Gemini needs escalate = "gemini" in [tool.dry-lint] and GEMINI_API_KEY in the environment.)
    required: false
    default: ""
  claude-code-oauth-token:
    description: >
      Claude subscription token (claude setup-token). With it, the claude-code judge runs on the subscription
      (preset jev+claude-code: Opus, as jev+opus; or claude-code alone); the claude CLI is installed only when this is set.
    required: false
    default: ""
  claude-code-version:
    description: The @anthropic-ai/claude-code version installed for claude-code-oauth-token.
    required: false
    default: "2.1.311"
  preset:
    description: Judging preset (dry-lint config lists them). Empty lets dry-lint choose from the keys it has.
    required: false
    default: ""
  budget-usd:
    description: >
      Most judging spends on a pull request, across all its pushes, at list price (subscriptions included); the
      riskiest pairs are judged first, and the report counts the rest. Empty uses the settings (default 0.04).
    required: false
    default: ""
  judge:
    description: auto (Jev when typesafe-api-key is set, otherwise none), jev, command, none, or an installed judge plugin.
    required: false
    default: auto
  judge-command:
    description: For judge "command", a command that reads the prompt on stdin and prints a JSON verdict.
    required: false
    default: ""
  plugins:
    description: Extra packages to install, such as judge plugins, one per line. Taken only from here, never from the pull request.
    required: false
    default: ""
  base:
    description: Ref or SHA to compare with. Default, the pull request's base commit, or the previous push, or the default branch.
    required: false
    default: ""
  working-directory:
    description: Where the repository (or the package to check in a monorepo) is.
    required: false
    default: "."
  repositories:
    description: >
      Optional checked-out repositories, one OWNER/NAME=PATH per line, including working-directory.
      Compare changed functions only against peers. Paths are relative to the workflow working directory.
      Checkout trusted peers before this action; no repositories are fetched or executed by dry-lint.
    required: false
    default: ""
  repository-indexes:
    description: >
      Trusted peers, one OWNER/NAME@REF per line. Download their exact-commit function indexes, rebuilding
      unavailable indexes from verified source archives. No peer clone or repository code execution.
    required: false
    default: ""
  index-token:
    description: Token with Actions read and Contents read access to peer repositories. Defaults to github-token.
    required: false
    default: ""
  comment:
    description: Keep one pull request comment with the findings up to date.
    required: false
    default: "true"
  comment-on-clean:
    description: Comment on a clean pull request too, with what was checked. "false" comments only once there are findings.
    required: false
    default: "true"
  share-totals:
    description: >-
      On the default branch, add each merged pull request's counts (duplicates kept out, pushes, judgments, spend;
      the repository only as a hash of its name) to dry-lint's public counter. "false" to opt out.
    required: false
    default: "true"
  check-run:
    description: In judge mode, post a "dry-lint" check run on the pull request's head (neutral with findings, so it never blocks).
    required: false
    default: "true"
  sticky-key:
    description: >
      Legacy marker label, and what tells apart the verdict saves of several invocations in one job (they share one
      store, so one pull request budget). All reports share one PR comment; use one serialized publisher.
    required: false
    default: ""
  fail-at:
    description: >
      Judge score at or above which a duplicate fails the check. Empty uses the preset's (0.55 with jev+opus, 0.8
      with jev) or fail_at from [tool.dry-lint]. A higher value fails only near-certain ones; findings between
      report_at and it only warn.
    required: false
    default: ""
  warn-only:
    description: Never fail; blocking findings are reported like the rest.
    required: false
    default: "false"
  override-label:
    description: A pull request label that turns blocking findings into warnings, for a false positive or an urgent merge.
    required: false
    default: "dry-lint: override"
  github-token:
    description: Token for commenting and, in judge mode, for downloading the triggering run's artifact.
    required: false
    default: ${{ github.token }}

outputs:
  index-name:
    description: Published function index artifact name, including schema, extraction contract and source commit.
    value: ${{ steps.run.outputs.index-name }}
  index-arguments:
    description: JSON file containing the CLI --repo-index arguments for downloaded peer indexes.
    value: ${{ steps.run.outputs.index-arguments }}
  mode:
    description: The mode that ran.
    value: ${{ steps.plan.outputs.mode }}
  findings:
    description: How many duplicates were reported.
    value: ${{ steps.run.outputs.findings }}
  blocking:
    description: How many of them reach fail_at.
    value: ${{ steps.run.outputs.blocking }}
  overridden:
    description: Whether the override label turned blocking findings into warnings.
    value: ${{ steps.run.outputs.overridden }}
  exit-code:
    description: dry-lint's exit code, 0 nothing blocking, 1 blocking findings, 2 dry-lint could not run.
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
    - name: Install dry-lint
      shell: bash
      env:
        PLUGINS: ${{ inputs.plugins }}
      # One Python and the locked parser versions: a function index is reusable only between runs whose
      # extraction contract (dry-lint, Python, tree-sitter) matches, so publishers and consumers must agree.
      run: |
        uv venv --quiet --allow-existing --python 3.13 "$RUNNER_TEMP/dry-lint-venv"
        locked="$RUNNER_TEMP/dry-lint-requirements.txt"
        uv export --quiet --project "$GITHUB_ACTION_PATH" --frozen --no-dev --no-emit-project --no-hashes -o "$locked"
        mapfile -t extra < <(printf '%s\n' "$PLUGINS" | sed '/^[[:space:]]*$/d')
        # The caller's tool.uv constraints belong to its application, not this isolated tool environment.
        uv pip install --no-config --quiet --python "$RUNNER_TEMP/dry-lint-venv" -r "$locked" --constraint "$locked" \
          "$GITHUB_ACTION_PATH" "${extra[@]}"
        echo "$RUNNER_TEMP/dry-lint-venv/bin" >> "$GITHUB_PATH"
    - name: Install the claude CLI
      if: inputs.claude-code-oauth-token != ''
      shell: bash
      env:
        VERSION: ${{ inputs.claude-code-version }}
      run: npm install --global --no-fund --no-audit "@anthropic-ai/claude-code@$VERSION"
    - name: Plan
      id: plan
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
      run: python -m dry_lint.action plan
    - name: Download candidates
      if: steps.plan.outputs.mode == 'judge'
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dry-lint-candidates
        path: ${{ runner.temp }}/dry-lint/in
        run-id: ${{ steps.plan.outputs.workflow-run-id }}
        github-token: ${{ inputs.github-token }}
    # Every invocation in a job shares one store, including the pull request's budget (spent-*.json): restore it
    # once, so a later invocation never rolls back what an earlier one recorded. Each invocation saves under its own
    # key; the newest save holds them all, and the next run restores that one by the shared prefix.
    - name: Restore verdicts
      if: (steps.plan.outputs.mode == 'single' || steps.plan.outputs.mode == 'judge') && env.DRY_LINT_VERDICTS_RESTORED != 'true'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/dry-lint/verdicts
        key: dry-lint-verdicts-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}-
        restore-keys: dry-lint-verdicts-${{ github.job }}-
    - name: Share the verdicts with later invocations in this job
      if: steps.plan.outputs.mode == 'single' || steps.plan.outputs.mode == 'judge'
      shell: bash
      run: echo "DRY_LINT_VERDICTS_RESTORED=true" >> "$GITHUB_ENV"
    - name: Run
      id: run
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_JUDGE: ${{ inputs.judge }}
        INPUT_JUDGE_COMMAND: ${{ inputs.judge-command }}
        INPUT_REPOSITORIES: ${{ inputs.repositories }}
        INPUT_REPOSITORY_INDEXES: ${{ inputs.repository-indexes }}
        INPUT_INDEX_TOKEN: ${{ inputs.index-token }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_COMMENT_ON_CLEAN: ${{ inputs.comment-on-clean }}
        INPUT_SHARE_TOTALS: ${{ inputs.share-totals }}
        INPUT_STICKY_KEY: ${{ inputs.sticky-key }}
        INPUT_CHECK_RUN: ${{ inputs.check-run }}
        INPUT_FAIL_AT: ${{ inputs.fail-at }}
        INPUT_WARN_ONLY: ${{ inputs.warn-only }}
        INPUT_OVERRIDE_LABEL: ${{ inputs.override-label }}
        TYPESAFE_AI_API_KEY: ${{ inputs.typesafe-api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        INPUT_PRESET: ${{ inputs.preset }}
        INPUT_BUDGET_USD: ${{ inputs.budget-usd }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: python -m dry_lint.action run
    - name: Save verdicts
      if: always() && steps.run.outputs.stored == 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/dry-lint/verdicts
        key: dry-lint-verdicts-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.sticky-key || 'default' }}
    - name: Upload candidates
      if: steps.plan.outputs.mode == 'detect'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dry-lint-candidates
        path: ${{ runner.temp }}/dry-lint/candidates.json
        retention-days: 3
        if-no-files-found: ignore
    - name: Upload function index
      if: steps.plan.outputs.mode == 'index'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.run.outputs.index-name }}
        path: ${{ steps.run.outputs.index-path }}
        retention-days: 14
        if-no-files-found: error
