# Inherit the repository policy: balanced function judging and separate agent model review.
- id: dry-lint
  name: dry-lint
  description: Flag staged function duplication and model consolidation candidates. Use --no-models to opt out of models.
  entry: dry-lint check --staged --env-file .env
  language: python
  additional_dependencies: ["anthropic>=1.0", "langchain-anthropic>=1.7,<2", "python-dotenv>=1,<2"]  # the `hooks` extra: Claude judges, and .env
  # Metadata-only changes, including deleting the ignore file, can reopen a pair.
  always_run: true
  stages: [pre-commit]
  pass_filenames: false
  require_serial: true
# What the hook above saw fixed or dismissed before the commit, written into the commit's message as trailers so
# the pull request's comment counts it. Install its stage once: `pre-commit install -t prepare-commit-msg`.
- id: dry-lint-schema-policy
  name: dry-lint schema ownership
  description: Enforce explicitly configured Python structured-output schema boundaries.
  entry: dry-lint schema-check --staged
  language: python
  additional_dependencies: ["anthropic>=1.0", "langchain-anthropic>=1.7,<2", "python-dotenv>=1,<2"]  # share the other hooks' environment
  pass_filenames: false
  always_run: true
  stages: [pre-commit]

- id: dry-lint-trailers
  name: dry-lint trailers
  description: Record in the commit message the findings no longer reported before the commit.
  entry: dry-lint trailers
  language: python
  additional_dependencies: ["anthropic>=1.0", "langchain-anthropic>=1.7,<2", "python-dotenv>=1,<2"]  # the same environment as the hook above
  stages: [prepare-commit-msg]
  always_run: true
